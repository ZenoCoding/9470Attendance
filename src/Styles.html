<style>
  :root {
    color-scheme: light;
    --ink: #171717;
    --muted: #6b7280;
    --paper: #ffffff;
    --canvas: #f4f5f7;
    --line: #e5e7eb;
    --accent: #dc2626;
    --accent-dark: #991b1b;
    --success: #15803d;
    --danger-soft: #fee2e2;
    --radius: 16px;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  button, input { font: inherit; }

  button { -webkit-tap-highlight-color: transparent; }

  .app {
    width: min(1040px, 100%);
    min-height: 100vh;
    margin: 0 auto;
    padding: clamp(20px, 4vw, 48px);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  h1, h2, p { margin-top: 0; }

  h1 {
    margin-bottom: 0;
    font-size: clamp(30px, 5vw, 48px);
    line-height: 1;
    letter-spacing: -0.04em;
  }

  h2 {
    margin-bottom: 22px;
    font-size: clamp(26px, 4vw, 38px);
    line-height: 1.1;
    letter-spacing: -0.03em;
  }

  .team-mark {
    color: var(--accent);
    font-weight: 800;
    letter-spacing: 0.03em;
  }

  .setup-notice {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: -12px 0 18px;
    border: 1px solid #f59e0b;
    border-radius: 12px;
    background: #fffbeb;
    color: #92400e;
    padding: 11px 14px;
    font-size: 14px;
  }

  .setup-notice span { color: #a16207; }

  .search, .field {
    width: 100%;
    min-height: 56px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--paper);
    color: var(--ink);
    padding: 0 18px;
    outline: none;
  }

  .search {
    margin-bottom: 18px;
    font-size: 18px;
  }

  .search:focus, .field:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(23, 23, 23, 0.1);
  }

  .student-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
  }

  .student-button, .key, .button, .text-button {
    border: 0;
    cursor: pointer;
  }

  .student-button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 72px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--paper);
    color: var(--ink);
    padding: 14px 16px;
    text-align: left;
    font-size: 17px;
    font-weight: 650;
    line-height: 1.25;
  }

  .student-button:hover, .student-button:focus-visible {
    border-color: var(--ink);
    transform: translateY(-1px);
  }

  .student-button.checked-in {
    cursor: default;
    border-color: var(--line);
    background: #e9eaed;
    color: var(--muted);
    transform: none;
  }

  .checked-label {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 750;
    white-space: nowrap;
  }

  .setup-label {
    flex: 0 0 auto;
    color: #92400e;
    font-size: 12px;
    font-weight: 750;
    white-space: nowrap;
  }

  .panel {
    width: min(480px, 100%);
    margin: min(12vh, 90px) auto 0;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--paper);
    padding: clamp(24px, 5vw, 40px);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.07);
  }

  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 26px 0;
  }

  .pin-instruction {
    margin-bottom: 0;
    color: var(--muted);
    text-align: center;
    font-weight: 650;
  }

  .pin-dot {
    width: 18px;
    height: 18px;
    border: 2px solid #9ca3af;
    border-radius: 999px;
    background: transparent;
  }

  .pin-dot.filled { border-color: var(--ink); background: var(--ink); }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 0 auto;
  }

  .key {
    min-height: 62px;
    border-radius: 13px;
    background: var(--canvas);
    color: var(--ink);
    font-size: 23px;
    font-weight: 700;
  }

  .key:hover, .key:focus-visible { background: #e8e9ec; }
  .key.submit { background: var(--ink); color: var(--paper); }
  .key.submit:disabled { cursor: default; opacity: 0.35; }

  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
  }

  .button {
    min-height: 50px;
    border-radius: 12px;
    background: var(--ink);
    color: var(--paper);
    padding: 0 20px;
    font-weight: 750;
  }

  .button:disabled { cursor: default; opacity: 0.45; }
  .button.danger { background: var(--accent); }

  .text-button {
    background: transparent;
    color: var(--muted);
    padding: 10px 0;
    font-weight: 650;
  }

  .text-button:hover, .text-button:focus-visible { color: var(--ink); }

  .status {
    min-height: 24px;
    margin: 18px 0 0;
    color: var(--accent-dark);
    text-align: center;
    font-weight: 650;
  }

  .field-label {
    display: block;
    margin: 18px 0 8px;
    font-size: 14px;
    font-weight: 750;
  }

  .field { font-size: 22px; letter-spacing: 0.18em; }

  .success {
    display: grid;
    min-height: calc(100vh - 96px);
    place-content: center;
    text-align: center;
  }

  .success-icon {
    display: grid;
    width: 84px;
    height: 84px;
    margin: 0 auto 24px;
    place-items: center;
    border-radius: 999px;
    background: #dcfce7;
    color: var(--success);
    font-size: 46px;
    font-weight: 900;
  }

  .success h1 { margin-bottom: 12px; }
  .success p { color: var(--muted); font-size: 19px; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .loading { pointer-events: none; }
  .loading > * { opacity: 0.55; }

  .request-notice {
    position: fixed;
    z-index: 20;
    left: 50%;
    bottom: 30px;
    width: min(520px, calc(100% - 40px));
    transform: translateX(-50%);
    border-radius: 14px;
    background: var(--ink);
    color: var(--paper);
    padding: 15px 18px;
    text-align: center;
    font-weight: 700;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
  }
  .empty { padding: 48px 0; color: var(--muted); text-align: center; }

  @media (max-width: 600px) {
    .app { padding: 20px; }
    .topbar { margin-bottom: 20px; }
    .student-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .student-button { min-height: 68px; padding: 12px; font-size: 15px; }
    .panel { margin-top: 2vh; box-shadow: none; }
    .setup-notice { align-items: flex-start; flex-direction: column; gap: 2px; margin-top: -6px; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .student-button, .key, .button { transition: 140ms ease; }
  }
</style>
